function MultiCat({ cats, onContinue }) {
  const catEntries = Object.entries(cats);
  const [step, setStep] = useState(0);
  const [selBycat, setSelBycat] = useState({});
  const [cat, items] = catEntries[step];
  const catSel = selBycat[cat] || [];
  const toggle = x => {
    const isNA = x.startsWith("N/A");
    setSelBycat(p => {
      const prev = p[cat] || [];
      let next;
      if (isNA) { next = prev.includes(x) ? [] : [x]; }
      else { const w = prev.filter(i => !i.startsWith("N/A")); next = w.includes(x) ? w.filter(i=>i!==x) : [...w,x]; }
      return {...p, [cat]: next};
    });
  };
  const isLast = step === catEntries.length - 1;
  const next = () => {
    if (isLast) { onContinue(catEntries.flatMap(([k]) => selBycat[k] || [])); }
    else { setStep(s => s+1); }
  };
  const regularItems = items.filter(i => !i.startsWith("N/A"));
  const naItem = items.find(i => i.startsWith("N/A"));
  return (
    <div className="multi">
      <div className="mcat">{cat}</div>
      <div className="mgrid">
        {regularItems.map(item => (
          <button key={item} className={`chk ${catSel.includes(item)?"on":""}`} onClick={()=>toggle(item)}>
            <div className="chkbox">{catSel.includes(item)?"✓":""}</div>{item}
          </button>
        ))}
        {naItem && <div><hr className="divider"/><button key={naItem} className={`chk na ${catSel.includes(naItem)?"on":""}`} onClick={()=>toggle(naItem)}><div className="chkbox">{catSel.includes(naItem)?"✓":""}</div>{naItem}</button></div>}
      </div>
      <div className="stepfoot">
        <span className="steplbl">{step+1} of {catEntries.length}</span>
        <button className="cont" style={{marginTop:0}} onClick={next}>{isLast ? "Continue →" : "Next →"}</button>
      </div>
    </div>
  );
}

function MultiFlatCat({ items, onContinue }) {
  const [sel, setSel] = useState([]);
  const toggle = x => setSel(p => p.includes(x) ? p.filter(i=>i!==x) : [...p,x]);
  return (
    <div className="multi">

    </div>
  );
}

      avoiding_judgment: "Your nervous system operates a protective cycle that associates being fully seen with being targeted, so it keeps you insulated behind endless preparation, polished offers, and flawless execution. What becomes possible when that cycle is renewed is the absolute freedom to be visible and launch before you're perfect — and to trust that God's love is the only baseline that was ever keeping score. Romans 8:1 — There is now no condemnation for those who are in Christ Jesus.",
      seeking_recognition: "Your nervous system operates a protective cycle based on the subconscious belief that your safety and worth must be actively proven through output. Rest feels unsafe. Receiving feels unearned. What becomes possible when that cycle is renewed is the ability to finally slow down and receive what you've already built — where your value is established securely in Christ, not verified by your next achievement. Romans 8:17 — Now if we are children, then we are heirs — heirs of God and co-heirs with Christ, if indeed we share in his sufferings in order that we may also share in his glory.",
      avoiding_pressure: "Your nervous system operates a protective cycle based on the rule that the next level will automatically cost you everything — your freedom, your family, your peace. So the moment a major breakthrough appears, your body hits the brakes. What becomes possible when that architecture is renewed is the discovery that God never designed the next level to crush you. The weight of more was always meant to be carried in rest with Him. Matthew 11:30 — For my yoke is easy and my burden is light."
    };
    const hbDesc = descMap[hb] || "";
    const cur = INCOME_VAL[incomeCeil]||0, nxt = INCOME_VAL[incNext]||0;
    const annual = Math.max(0,(nxt-cur)*12);
    await sendToGHL({
      firstName, lastName, email, phone,
      setPoint: sp, hiddenBenefit: hb, secondaryHiddenBenefit: shb, hiddenBenefitDescription: hbDesc,
      incomeCeiling: incomeCeil, moneyOnHand: moneyHand, incomeNext: incNext,
      annualCost: annual, hbScores, nonMoney, costItems, patterns,
      patternsByCategory: getPatternsByCategory(patterns),
      northStar,
    });
    await wait(1000); await say("Thank you. Let me show you what I see.");
    await wait(1600); setShowResults(true); setPhase("done");
  };

  const prog = () => {
    if (phase==="init"||phase==="name") return 2;
    if (phase==="prayer") return 8;
    if (phase==="abundance") return 10 + (aIdx/9)*20;
    if (ui?.type==="northstar") return 32;
    if (ui?.next==="incomebroad") return 34;
    if (ui?.next==="incomeceiling") return 36;
    if (ui?.type==="multicat") return 44;
    if (ui?.next==="moneyhand") return 50;
    if (ui?.type==="nonmoney") return 54+(nmIdx/4)*10;
    
    if (ui?.type==="costflat") return 72;
    if (ui?.type==="hb") return 76+(hbIdx/4)*20;
    if (phase==="contact") return 96;
    if (phase==="done") return 100;
    return 0;
  };

  const progLabel = () => {
    if (phase==="name"||phase==="prayer") return "Getting started";
    if (phase==="abundance"||ui?.type==="northstar") return "Abundance Inventory";
    if (ui?.next==="incomebroad"||ui?.next==="incomeceiling"||ui?.type==="multicat"||ui?.next==="moneyhand") return "Financial Set Point";
    if (ui?.type==="nonmoney") return "Non-Money Set Points";
    if (ui?.type==="costflat") return "The Real Cost";
    if (ui?.type==="hb") return `Hidden Benefit Assessment — Group ${hbIdx+1} of 4`;
    if (phase==="contact") return "Almost there";
    if (phase==="done") return "Complete";
    return "";
  };

  const renderUI = () => {
    if (!ui) return null;
    if (ui.type==="abundance") return (
      <div className="opts">
        <div className="qnum">{ui.idx+1} of {STATEMENTS.length}</div>
        <div className="qlabel">{STATEMENTS[ui.idx]}</div>
        {ANS_OPTS.map(o=><button key={o.label} className="opt" onClick={()=>handleAbundance(o.label)}>{o.label}</button>)}
      </div>
    );
    if (ui.type==="northstar") return (
      <div className="opts">{STATEMENTS.map(s=><button key={s} className="opt" onClick={()=>handleNorthStar(s)}>{s}</button>)}</div>
    );
    if (ui.type==="single") return (
      <div className="opts">{ui.opts.map(o=><button key={o} className="opt" onClick={()=>handleSingle(o,ui.next)}>{o}</button>)}</div>
    );
    if (ui.type==="nonmoney") {
      const nm = NON_MONEY[ui.idx];
      return (
        <div className="opts">
          <div style={{fontSize:10,fontWeight:500,letterSpacing:2,textTransform:"uppercase",color:"#E88504",marginBottom:8}}>{nm.label}</div>
          {nm.opts.map(o=><button key={o} className="opt" onClick={()=>handleNonMoney(o)}>{o}</button>)}
        </div>
      );
    }
    if (ui.type==="multicat") return <MultiCat cats={PATTERN_CATS} onContinue={handlePatterns} />;
    if (ui.type==="costflat") return <MultiFlatCat items={COST_OPTS} onContinue={handleCostItems} />;
    if (ui.type==="hb") return <HBSelect cat={HB_CATS[ui.idx]} onContinue={handleHB} />;
    return null;
  };

  return (
    <div className="app">
      <div className="hdr">
        <div className="hdr-eye">Kingdom Alignment Academy</div>
        <div className="hdr-title">Kingdom Abundance Assessment</div>
        <div className="hdr-sub">A personal clarity experience with Sarah Rachel</div>
      </div>
      {phase!=="init" && (
        <>
          <div className="pbar" style={{width:"100%",maxWidth:640}}><div className="pfill" style={{width:prog()+"%"}} /></div>
          <div className="plabel">{progLabel()}</div>
        </>
      )}
      <div className="chat">
        {msgs.map(m=>(
          <div key={m.id} className={`msg ${m.from==="u"?"user":""}`}>
            <div className={`av ${m.from==="s"?"s":"u"}`}>{m.from==="s"?"S":name?name[0].toUpperCase():"Y"}</div>
            <div className={`bub ${m.from==="s"?"s":"u"}`} style={{whiteSpace:"pre-line"}}>{m.text}</div>
          </div>
        ))}
        {typing && <div className="msg"><div className="av s">S</div><div className="typing"><span/><span/><span/></div></div>}
      </div>
      {phase==="name" && (
        <div className="inrow">
          <input className="txtin" placeholder="Your name..." value={nameInput} onChange={e=>setNameInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleName()} autoFocus />
          <button className="sndbtn" onClick={handleName}>→</button>
        </div>
      )}
      {phase==="quickshift" && (
        <div className="prayer-btn">
          <button className="cont" style={{width:"100%",padding:"14px"}} onClick={async()=>{userSay("Continue");setPhase("abundance");await new Promise(res=>setTimeout(res,300));setMsgs(p=>[...p,{text:"Your abundance set point isn't just about money. Let's look at the full picture.",from:"s",id:Date.now()+Math.random()}]);await new Promise(res=>setTimeout(res,1000));setNmIdx(0);setUi({type:"nonmoney",idx:0});}}>I'm ready — Continue →</button>
        </div>
      )}
      {phase==="prayer" && (
        <div className="prayer-btn">
          <button className="cont" style={{width:"100%",padding:"14px"}} onClick={handlePrayer}>I've prayed — Continue →</button>
        </div>
      )}
      {renderUI()}
      {showContact && <ContactForm onSubmit={handleContact} />}
      {showResults && (
        <Results
          name={contact ? `${contact.firstName} ${contact.lastName}` : name}
          tallies={tallies} hbScores={hbScores}
          incomeCeiling={incomeCeil} incomeNext={incNext}
          patterns={patterns} moneyOnHand={moneyHand}
          northStar={northStar} nonMoney={nonMoney} costItems={costItems}
        />
      )}
      <div ref={bottom} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
